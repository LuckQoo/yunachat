<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Ganyu Live2D 模型展示</title>
  <style>
    html, body {
      margin: 0;
      background-color: #111;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .loading {
      color: white;
      position: absolute;
      top: 20px;
      left: 20px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div class="loading">正在召喚甘雨中...</div>
  <script src="https://unpkg.com/pixi.js@5.3.3/dist/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@3.0.5/dist/index.min.js"></script>
  <script>
    const app = new PIXI.Application({
      view: document.body.appendChild(document.createElement("canvas")),
      autoStart: true,
      resizeTo: window,
      transparent: true
    });

    PIXI.live2d.Live2DModel.from("ganyu_model/ganyu.model3.json").then(model => {
      model.scale.set(0.2);
      model.position.set(window.innerWidth / 2, window.innerHeight / 2);
      app.stage.addChild(model);
      document.querySelector(".loading").textContent = "甘雨已經上線！";
    }).catch(error => {
      document.querySelector(".loading").textContent = "❌ 模型載入失敗";
      console.error("模型載入錯誤：", error);
    });
  </script>
</body>
</html>
